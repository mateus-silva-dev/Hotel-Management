spring:
  application:
    name: Hotel-Management

  jpa:
    open-in-view: false

  profiles:
    active: ${APP_PROFILE:test}

  security:
    client-id: ${CLIENT_ID}
    client-secret: ${CLIENT_SECRET}
    jwt:
      duration: ${JWT_DURATION}

  jackson:
    deserialization:
      fail-on-unknown-properties: true